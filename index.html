<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Match Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<!-- ===================== HTML ===================== -->
<body>
  <main class="card">
    <h1>Match Maker</h1>
    <p class="sub">Enter two names to see how well they match.</p>

    <form id="matchForm" novalidate>
      <div class="field">
        <label for="name1">Your name</label>
        <input id="name1" type="text" autocomplete="off" placeholder="e.g. Amina">
      </div>
      <div class="field">
        <label for="name2">Partner's name</label>
        <input id="name2" type="text" autocomplete="off" placeholder="e.g. David">
      </div>
      <p class="error" id="error" role="alert"></p>
      <button type="submit" id="matchBtn">Find the match</button>
    </form>

    <section class="result" id="result" aria-live="polite">
      <div class="heart-wrap" id="heartWrap">
        <svg viewBox="0 0 100 92" aria-hidden="true">
          <defs>
            <clipPath id="heartClip">
              <path id="heartPath" d="M50 88 C20 62 4 46 4 28 C4 14 15 4 28 4 C38 4 46 9 50 17 C54 9 62 4 72 4 C85 4 96 14 96 28 C96 46 80 62 50 88 Z"/>
            </clipPath>
          </defs>
          <path d="M50 88 C20 62 4 46 4 28 C4 14 15 4 28 4 C38 4 46 9 50 17 C54 9 62 4 72 4 C85 4 96 14 96 28 C96 46 80 62 50 88 Z" fill="var(--heart-empty)"/>
          <rect id="fillRect" class="fill-rect" x="0" y="92" width="100" height="92" fill="#e8325f" clip-path="url(#heartClip)"/>
        </svg>
        <div class="percent" id="percent">0%</div>
      </div>
      <p class="names" id="names"></p>
      <p class="message" id="message"></p>
    </section>
  </main>

<script src="script.js"></script>
</body>
</html>
